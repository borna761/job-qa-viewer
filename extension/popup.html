<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #111; }

  #root { padding: 14px 16px; }
  .loading { color: #6b7280; }

  /* Tracked view */
  .company { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .role { color: #374151; margin-bottom: 8px; }
  .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .stage-badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 500; }
  .date { color: #6b7280; font-size: 12px; }

  .btn-row { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  .open-btn { display: inline-block; padding: 5px 12px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; text-decoration: none; }
  .open-btn:hover { background: #1e40af; }
  .refresh-btn { padding: 5px 8px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; cursor: pointer; line-height: 1; }
  .refresh-btn:hover { background: #e5e7eb; }
  .refresh-btn:disabled { opacity: .5; cursor: default; }
  .notion-btn { display: inline-block; padding: 5px 10px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; font-family: inherit; cursor: pointer; }
  .notion-btn:hover { background: #e5e7eb; }
  .notion-btn:disabled { opacity: .5; cursor: default; }

  /* Emails */
  .emails-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; margin-bottom: 6px; }
  .email-item { border-top: 1px solid #f3f4f6; padding: 7px 0; }
  .email-subject { font-weight: 500; margin-bottom: 2px; line-height: 1.3; }
  .email-meta { font-size: 11px; color: #9ca3af; }
  .email-label { display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 10px; font-weight: 500; margin-left: 4px; }
  .email-label--rejected { background: #fee2e2; color: #b91c1c; }
  .email-label--interview { background: #ede9fe; color: #5b21b6; }
  .email-label--applied  { background: #dbeafe; color: #1d4ed8; }
  .no-emails { color: #9ca3af; font-size: 12px; padding: 6px 0; }

  /* Save form */
  .save-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; font-weight: 500; color: #6b7280; margin-bottom: 3px; }
  .field input, .field select { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .field input:focus, .field select:focus { outline: 2px solid #1d4ed8; border-color: transparent; }
  .save-btn { width: 100%; padding: 7px; background: #1d4ed8; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .save-btn:disabled { opacity: .55; cursor: default; }
  .status { margin-top: 8px; font-size: 12px; }
  .status--ok  { color: #15803d; }
  .status--err { color: #b91c1c; }
</style>
</head>
<body>
  <div id="root"><p class="loading" style="padding:14px">Loading…</p></div>
  <script src="popup.js"></script>
</body>
</html>
